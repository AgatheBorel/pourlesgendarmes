# Construit le site et le publie sur l'hébergement OVH en SFTP (connexion chiffrée).
# Se déclenche : à chaque modification, chaque matin (articles programmés), ou manuellement (onglet Actions).
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Si un article est mal rempli, la construction échoue ici avec un message clair et rien n'est publié.
      - name: Construire le site
        run: npm run build

      - name: Préparer la configuration du formulaire
        env:
          CONFIG_SEL: ${{ secrets.CONFIG_SEL }}
        run: |
          mkdir -p deploiement-config
          sed "s#REMPLACER-PAR-UNE-CHAINE-ALEATOIRE-LONGUE#${CONFIG_SEL}#" config/pourlesgendarmes.example.php > deploiement-config/pourlesgendarmes.php

      - name: Installer l'outil d'envoi SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Envoi chiffré : la configuration dans ~/config, le site dans ~/www (fichiers cachés comme .htaccess compris).
      # Les fichiers supprimés du site sont aussi supprimés du serveur ; le dossier .well-known (certificats SSL) est préservé.
      - name: Envoyer sur OVH (SFTP)
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SERVEUR: ${{ secrets.FTP_SERVER }}
          UTILISATEUR: ${{ secrets.FTP_USERNAME }}
        run: |
          lftp --env-password -u "$UTILISATEUR" "sftp://$SERVEUR:22" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --verbose=1 deploiement-config/ config/;
            mirror --reverse --delete --verbose=1 --exclude-glob .well-known/ dist/ www/;
            bye"
