# Construit le site et le publie sur l'hébergement OVH.
# Se déclenche à chaque modification, chaque matin (articles programmés), ou manuellement (onglet Actions).
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Préparer la configuration du formulaire
        env:
          CONFIG_SEL: ${{ secrets.CONFIG_SEL }}
        run: |
          mkdir -p deploiement-config
          sed "s#REMPLACER-PAR-UNE-CHAINE-ALEATOIRE-LONGUE#${CONFIG_SEL}#" config/pourlesgendarmes.example.php > deploiement-config/pourlesgendarmes.php

      - name: Envoyer la configuration sur OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploiement-config/
          server-dir: ./config/

      - name: Envoyer le site sur OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./www/
